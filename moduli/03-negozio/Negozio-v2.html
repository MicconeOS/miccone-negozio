<style>
@font-face{font-family:'Miso';src:url('../../shared/fonts/Miso-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Miso';src:url('../../shared/fonts/Miso-Bold.woff2') format('woff2');font-weight:700;}
*{margin:0;box-sizing:border-box;font-family:'Miso','Trebuchet MS',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{--crosta:#7B4D35;--scuro:#3E2A1E;--crema:#F4EEDF;--panna:#FBF7F0;--oro:#F0C061;--rosso:#D63A2B;--verde:#5fa06a}
body{background:var(--crema);color:var(--scuro)}
.wrap{max-width:820px;margin:0 auto;min-height:100vh;position:relative}
.hide{display:none!important}
.futuro{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:#FBEBC9;color:#7B4D35;font-weight:700;font-size:15px;text-align:center}

/* LOGIN */
.lg{min-height:100vh;background:linear-gradient(160deg,#7B4D35,#5A3722);display:flex;flex-direction:column;align-items:center;color:#FBF6EA;padding:8vh 36px 40px}
.lg img.badge{width:110px;filter:brightness(0) invert(1);opacity:.96}
.lg h1{margin-top:24px;font-size:40px;font-weight:700;text-align:center}
.lg .sub{margin-top:10px;font-size:22px;color:#E8D5BD;text-align:center}
.people{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:620px}
.people button{background:rgba(255,255,255,.12);color:#FBF6EA;border:none;border-radius:20px;padding:22px 28px;font-size:26px;font-weight:700;cursor:pointer;min-width:180px}
.people button small{display:block;font-size:16px;color:#E8D5BD;font-weight:400;margin-top:4px}
.dots{margin-top:26px;display:flex;gap:16px;height:26px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid #E8D5BD}
.dots i.on{background:var(--oro);border-color:var(--oro)}
.pad{margin-top:26px;display:grid;grid-template-columns:repeat(3,120px);gap:18px}
.pad button{height:92px;border-radius:20px;border:none;background:rgba(255,255,255,.12);color:#FBF6EA;font-size:38px;font-weight:700;cursor:pointer}
.pad button.act{background:var(--oro);color:#5A3722}
.err{margin-top:16px;color:#FFD9D2;font-size:20px;min-height:24px}

/* GIORNATA */
.top{background:var(--crosta);color:#FBF6EA;padding:24px 26px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.top .sede{font-size:18px;font-weight:700;letter-spacing:2px}.top .sede b{color:var(--oro)}
.top .ciao{margin-top:4px;font-size:32px;font-weight:700}
.top .data{margin-top:2px;font-size:20px;color:#E8D5BD;text-transform:capitalize}
.top .game{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .game .pt{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:16px;font-weight:700;color:#FBF6EA}
.top .game .ob{font-size:22px;letter-spacing:3px;line-height:1}
.topR{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.ringwrap{position:relative;width:96px;height:96px}
.ringwrap .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .pct b{font-size:27px;font-weight:700;color:#FBF6EA;line-height:1}.ringwrap .pct span{font-size:13px;color:var(--oro);font-weight:700;margin-top:3px}
.topR .esci{background:rgba(255,255,255,.15);border:none;color:#FBF6EA;border-radius:12px;padding:6px 18px;font-size:15px;font-weight:700;cursor:pointer}
.fasi{display:flex;gap:10px;padding:16px 20px 6px}
.fase{flex:1;border-radius:16px;padding:12px 6px;text-align:center;background:#EaddC9;color:#8a7458;border:none;cursor:pointer}
.fase.on{background:var(--scuro);color:#FBF6EA}.fase.on .n{color:var(--oro)}
.fase.done{background:#dfe7d8;color:#3f7a4e}.fase.done .n{color:#3f7a4e}
.fase .h{font-size:19px;font-weight:700;letter-spacing:1px}.fase .n{margin-top:3px;font-size:15px}
.list{padding:6px 20px 120px}
.sez{font-size:16px;font-weight:700;color:#B98A2E;letter-spacing:2px;margin:20px 6px 10px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:12px;box-shadow:0 3px 8px rgba(62,42,30,.06);cursor:pointer}
.row .ic{width:50px;height:50px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.ic.procedure{background:#F3E4CF}.ic.haccp{background:#DCE9F2}.ic.pulizie{background:#E7F1DE}.ic.produzione{background:#F6E0CE}.ic.manager{background:#F3E6BE}
.row .tx{flex:1}.row .tx .c{font-size:24px;font-weight:700}.row .tx .s{font-size:16px;color:#9a8b7a;margin-top:2px}
.check{width:52px;height:52px;border-radius:50%;border:4px solid #d8c8b0;flex:none;position:relative}
.row.ok{background:#f2f8ee}.row.ok .tx .c{color:#6f8a5f;text-decoration:line-through}
.row.ok .check{border-color:var(--verde);background:var(--verde)}
.row.ok .check::after{content:"";position:absolute;left:17px;top:9px;width:13px;height:24px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
.temp{width:104px;height:52px;border-radius:14px;border:3px solid #bcd2e4;background:#f2f8fc;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#2E6B96;flex:none}
.temp.empty{color:#9db4c6;border-style:dashed}
.temp.bad{border-color:var(--rosso);color:var(--rosso);background:#fdeceb}

const ICON={manager:{'miccone':'🍞','ordin':'📦'},procedure:{'olio':'🫒','luci':'💡','magazzin':'📦','tagliere':'🪵','caffe':'☕','macina':'☕','brioche':'🥐','forno':'🥐','cassa':'💶','fondo':'💶','conteggio':'💶','vetrina':'🪟','finestra':'🪟','macchine':'🔌','spegn':'🔌','frigor':'🧊','avanzi':'🧊','giro':'🔒','porta':'🔒'},produzione:{'salsa':'🥣','aranc':'🍊','limon':'🍋','craut':'🥬','cipoll':'🧅','hamburger':'🍔','burger':'🍔','salmon':'🐟','pulled':'🥩','porco':'🥩','patat':'🥔','pancetta':'🥓','formagg':'🧀','robiola':'🧀','pecorino':'🧀','capra':'🧀','verdur':'🥦','etichett':'🏷️','torta':'🎂','torte':'🎂','brownie':'🍫','pane':'🍞','impast':'🥖'},haccp:{'miccone':'🍞','pane':'🍞','frigo':'🌡️','congel':'❄️','olio':'🛢️','scadenz':'📅','etichett':'🏷️','superfici':'🧼'},pulizie:{'bidon':'🗑️','formagg':'🧀','cappa':'💨','frigo':'🧊','pane':'🍞','coltell':'🔪','piastra':'🥪','caff':'☕','carton':'📦','forno':'🔥','bagno':'🚻','paviment':'🧹','vetr':'🪟','divan':'🛋️','estintor':'🧯','finestra':'🪟','macina':'☕'}};

let S={store:null,emp:null,pin:'',giornata:null,momento:null};

function leggiSessione(){
  try{const v=JSON.parse(localStorage.getItem('miccone_sessione')||'null');
    if(v&&v.emp&&v.store&&Date.now()-(v.ts||0)<3*3600*1000)return v;}catch(e){}
  return null;
}
function salvaSessione(){
  try{localStorage.setItem('miccone_sessione',JSON.stringify({store:S.store,emp:S.emp,pin:S.pin||'',data:S.data||null,momento:S.momento||null,ts:Date.now()}));}catch(e){}
}
let STORES=[];
// Cache leggera (memoria + localStorage): il cambio persona è istantaneo, i dati si rinfrescano in sottofondo.
const CACHE={emps:{},giornate:{},pending:{}};
const FRESCA_EMPS=10*60*1000, FRESCA_GIORNATA=5*60*1000, FRESCA_STORES=24*3600*1000;
function cacheLS(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function keyG(storeId,iso){return storeId+'|'+iso;}
function giornataInCache(storeId,iso){const c=CACHE.giornate[keyG(storeId,iso)];return !!(c&&Date.now()-c.ts<FRESCA_GIORNATA);}
async function caricaGiornata(storeId,iso,fresca){
  const k=keyG(storeId,iso), c=CACHE.giornate[k];
  if(!fresca&&c&&Date.now()-c.ts<FRESCA_GIORNATA)return c.g;
  if(CACHE.pending[k])return CACHE.pending[k];
  const p=rpc('cassa_giornata',{p_store:storeId,p_giorno:iso}).then(g=>{CACHE.giornate[k]={g,ts:Date.now()};return g;}).finally(()=>{delete CACHE.pending[k];});
  CACHE.pending[k]=p;return p;
}
// mentre la persona sceglie il nome e scrive il PIN, la giornata di oggi è già in viaggio
function prefetchGiornata(){if(S.store)caricaGiornata(S.store.id,oggi()).catch(()=>{});}

function applicaGiornata(g,iso){if(S.emp&&S.giornata&&S.data===iso&&Date.now()-(S._ultimaSpunta||0)>5000){S.giornata=g;render();}}

    let sc=cacheLS('miccone_stores'); let reali=(sc&&sc.list)||null;
    if(!reali||Date.now()-(sc.ts||0)>FRESCA_STORES){reali=await rpc('cassa_stores',{}).catch(()=>reali||[]);cacheLS('miccone_stores',{list:reali,ts:Date.now()});}
    else rpc('cassa_stores',{}).then(l=>cacheLS('miccone_stores',{list:l,ts:Date.now()})).catch(()=>{});

    const test=IN_PROVA?[{id:'00000000-0000-4000-a000-000000000002',name:'🧪 Palestra Duomo',slug:'palestra-duomo'},
                        {id:'00000000-0000-4000-a000-000000000001',name:'🧪 Palestra Borgo',slug:'palestra-borgo'}]:[];
    STORES=[...reali,...test];
    // link diretto per negozio: ?sede=borgo oppure ?sede=duomo (l'iPad di ogni negozio usa il suo)

    const slugFisso={borgo:'borgo-ticino',duomo:'piazza-duomo'}[sedeParam]||sedeParam;
    const fisso=STORES.find(s=>s.slug===slugFisso);
    if(fisso){S.store=fisso;S.sedeFissa=true;prefetchGiornata();}
    const ses=leggiSessione();
    if(ses&&(!fisso||(ses.store&&ses.store.id===fisso.id))){S.emp=ses.emp;if(ses.store)S.store=ses.store;S.pin=ses.pin||'';S._rip={data:ses.data,momento:ses.momento};return entra();}
    if(fisso)return schermataLogin();
    schermataStore();
  }catch(e){app().innerHTML=`<div class="loading">Niente rete. Riprova tra poco.</div>`;}
}

// Primo ingresso senza PIN: il dipendente lo sceglie (4-6 cifre, ripetuto) e da lì in poi serve sempre.
async function pickPerson(e){
  S.emp=e;S.pin='';S.nuovoPin=null;
  S.modoPin=(e.has_pin===false)?'nuovo':'login';
  schermataPin();
}
function schermataPin(){
  const nuovo=S.modoPin==='nuovo';
  const sub=nuovo?(S.nuovoPin?'Ripeti il PIN per confermarlo':'Primo ingresso: scegli il tuo PIN (4 cifre). Lo userai ogni giorno'):'Il tuo PIN è la tua firma';
  app().innerHTML=`<div class="lg">

    <div class="err" id="err"></div>
    <button onclick="schermataLogin()" style="margin-top:20px;background:none;border:none;color:#D9C2AE;font-size:18px">← indietro</button></div>`;
  disegnaDots();
}
function disegnaDots(){const n=Math.max(4,Math.min(6,S.pin.length));document.getElementById('dots').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<S.pin.length?'on':''}"></i>`).join('');}
async function tasto(t){
  if(t==='c'){S.pin='';disegnaDots();return;}
  if(t==='ok'){return S.modoPin==='nuovo'?confermaNuovoPin():verificaPin();}
  if(S.pin.length<6){S.pin+=t;disegnaDots();if(S.pin.length>=4){/* prova auto a 4 */}}
}
async function confermaNuovoPin(){
  const err=document.getElementById('err');
  if(S.pin.length<4){err.textContent='Il PIN deve avere almeno 4 cifre';return;}
  if(!S.nuovoPin){S.nuovoPin=S.pin;S.pin='';schermataPin();return;}           // prima volta: memorizza e chiedi di ripetere
  if(S.pin!==S.nuovoPin){err.textContent='I due PIN non coincidono, ricomincia';S.nuovoPin=null;S.pin='';disegnaDots();return;}
  try{const r=await rpc('cassa_imposta_pin',{p_employee:S.emp.id,p_pin:S.pin});
    if(!r||!r.ok){err.textContent=(r&&r.errore)||'Non sono riuscito a salvare il PIN';S.pin='';disegnaDots();return;}
    const l=await rpc('cassa_login',{p_employee:S.emp.id,p_pin:S.pin});
    if(l&&l.id&&!l.errore){S.emp={id:l.id,name:l.name,role:l.role};S.modoPin='login';return entra();}
    err.textContent='PIN salvato: ora entra con il tuo PIN';S.modoPin='login';S.pin='';schermataPin();
  }catch(e){err.textContent='Niente rete, riprova';}
}
async function verificaPin(){
  try{const r=await rpc('cassa_login',{p_employee:S.emp.id,p_pin:S.pin});
    if(r&&r.id&&!r.errore){S.emp={id:r.id,name:r.name,role:r.role};entra();}
    else{const m=r&&r.errore==='TROPPI_TENTATIVI'?'Troppi tentativi, aspetta qualche minuto':'PIN sbagliato, riprova';document.getElementById('err').textContent=m;S.pin='';disegnaDots();}
  }catch(e){document.getElementById('err').textContent='PIN sbagliato, riprova';S.pin='';disegnaDots();}
}
async function entra(){
  app().innerHTML=`<div class="loading">Preparo la tua giornata…</div>`;
  // dopo un ricaricamento l'admin ritrova il giorno che stava guardando; i dipendenti vedono sempre oggi
  const rip=S._rip||{};S._rip=null;
  S.data=(S.emp&&S.emp.role==='admin'&&/^\d{4}-\d{2}-\d{2}$/.test(rip.data||''))?rip.data:oggi();
  salvaSessione();
  const daCache=giornataInCache(S.store.id,S.data);
  S.giornata=await caricaGiornata(S.store.id,S.data);
  // ritorno dall'app Cassa: segna fatta la voce che ha aperto la Cassa
  try{const f=JSON.parse(localStorage.getItem('negozio_fatto')||'null');
    if(f&&Date.now()-f.ts<3600*1000){const t=S.giornata.attivita.find(a=>a.cosa===f.cosa);
      if(t&&!t.fatto){t.fatto=true;rpc('cassa_task_spunta',{p_task:t.id,p_employee:S.emp.id,p_fatto:true}).catch(()=>{});}
      localStorage.removeItem('negozio_fatto');}
  }catch(e){}
  const ora=new Date().getHours();
  S.momento=['mattina','pomeriggio','sera'].includes(rip.momento)?rip.momento:(ora<12?'mattina':ora<18?'pomeriggio':'sera');
  salvaSessione();
  render();
  if(daCache){const iso=S.data;caricaGiornata(S.store.id,iso,true).then(g=>applicaGiornata(g,iso)).catch(()=>{});} // era in cache: rinfresco in sottofondo
}
function oggi(){return new Date().toLocaleDateString('en-CA');}
function settimanaGiorni(){
  const base=new Date(), wd=(base.getDay()+6)%7, mon=new Date(base); mon.setDate(base.getDate()-wd);
  const lab=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'], out=[];
  for(let i=0;i<7;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); out.push({iso:d.toLocaleDateString('en-CA'),lab:lab[i]});}
  return out;
}
let _seqGiorno=0;
async function cambiaGiorno(iso){
  const mio=++_seqGiorno;
  S.data=iso;salvaSessione();render(); // mostra subito "carico…" sul giorno nuovo
  const daCache=giornataInCache(S.store.id,iso);
  const g=await caricaGiornata(S.store.id,iso);
  if(mio!==_seqGiorno)return; // nel frattempo è stato scelto un altro giorno: ignora questa risposta
  S.giornata=g;render();
  if(daCache)caricaGiornata(S.store.id,iso,true).then(g2=>{if(mio===_seqGiorno)applicaGiornata(g2,iso);}).catch(()=>{});
}
function giornoFuturo(){return (S.data||oggi())>oggi();}
function statoFase(m){const a=S.giornata.attivita.filter(x=>x.momento===m);return{tot:a.length,fatti:a.filter(x=>x.fatto).length};}

      }else if(x.cosa.toLowerCase()==='cuocere le brioche'){
        lista+=briocheRow(x,done,cat);
      }else if(x.cosa.toLowerCase()==='produzione hamburger'){
        lista+=hamburgerRow(x,done,cat);

        lista+=apreRow(x,done,cat,APRE[x.cosa.toLowerCase()]);
      }else if((x.come||'').includes('||')||x.ricetta){
        lista+=stepsRow(x,done,cat);
      }else{
        lista+=`<div class="row ${done?'ok':''}" onclick="spunta('${x.id}',${!done})"><div class="ic ${cat}">${emoji(cat,x.cosa)}</div>
          <div class="tx"><div class="c">${x.cosa}</div><div class="s">${done?'fatto ✓':(x.come||'tocca quando è fatto')}</div></div>
          <div class="check"></div></div>`;
      }
    });
  });
  const caricando=!!(S.giornata&&S.giornata.giorno&&S.data&&S.giornata.giorno!==S.data); // giornata di un altro giorno: non mostrarla
  app().innerHTML=`
  <div class="top">

      <div class="sede">MICCONE · <b>${g.sede.replace('🧪 Palestra ','').toUpperCase()}</b></div>
      <div class="ciao">Ciao, ${S.emp.name.split(' ')[0]}</div>
      <div class="data">${data}</div>
      <div class="game"><span class="pt">🔥 ${punti} punti</span><span class="ob" title="obiettivi: mattina · pomeriggio · sera">${stelle}</span></div>
    </div>

        <svg viewBox="0 0 120 120" width="96" height="96"><circle cx="60" cy="60" r="52" fill="none" stroke="#5A3722" stroke-width="13"/>

        <div class="pct"><b>${pct}%</b><span>${fatti}/${tot}</span></div>
      </div>
      <button class="esci" onclick="esciTurno()">esci</button>
    </div>
  </div>
  ${isAdmin?`<div class="giorni" style="display:flex;gap:6px;padding:12px 16px 2px;background:#F4EEDF">${giorni.map(d=>`<button onclick="cambiaGiorno('${d.iso}')" style="flex:1;border:none;border-radius:12px;padding:9px 0;font:700 15px 'Miso',sans-serif;cursor:pointer;background:${d.iso===(S.data||oggi())?'#7B4D35':'#EADFCA'};color:${d.iso===(S.data||oggi())?'#FBF6EA':'#8a7458'}">${d.lab}</button>`).join('')}</div>`:''}
  <div class="fasi">${fasi.map(m=>{const s=statoFase(m);const cls=s.tot&&s.fatti===s.tot?'done':(m===S.momento?'on':'');return `<button class="fase ${cls}" onclick="vaiA('${m}')"><div class="h">${m.toUpperCase()}</div><div class="n">${s.fatti}/${s.tot}</div></button>`}).join('')}</div>
  ${giornoFuturo()?'<div class="futuro">📅 Giorno futuro: puoi guardare, le spunte si fanno il giorno stesso</div>':''}
  <div class="list">${caricando?'<div class="loading">Carico la giornata…</div>':(lista||'<div class="loading">Niente da fare in questo momento 🎉</div>')}</div>
  <div class="foot">${fatti===tot?'🏆 Giornata completa, grande!':(momentiFatti>0?`💪 ${momentiFatti}/3 obiettivi — continua così!`:(pct>=50?`🔥 ${pct}% fatto, spingi fino in fondo!`:'🔔 Quello che non spunti entro sera lo vede Giulio'))}</div>`;
}
function pasqua(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
  f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
  i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mo=Math.floor((a+11*h+22*l)/451),
  mm=Math.floor((h+l-7*mo+114)/31),dd=((h+l-7*mo+114)%31)+1;
  return new Date(y,mm-1,dd);
}
function festaHamburger(d){
  const y=d.getFullYear(),t=new Date(y,d.getMonth(),d.getDate()),md=(mo,da)=>new Date(y,mo-1,da);
  if(t>=md(12,18)||t<=md(1,6)) return 'Feste di Natale';        // Natale–Epifania
  if(t>=md(4,22)&&t<=md(5,1)) return 'Ponte 25 aprile / 1° maggio';
  const p=pasqua(y),ini=new Date(p),fin=new Date(p);            // Pasqua: settimana santa → Pasquetta
  ini.setDate(p.getDate()-9); fin.setDate(p.getDate()+1);
  if(t>=ini&&t<=fin) return 'Pasqua';
  return null;
}
function hamburgerRow(x,done,cat){
  // le dosi stanno nel testo della task ("18 hamburger … (22 nelle feste)"), così ogni negozio ha le sue
  const c=x.come||'',mb=c.match(/(\d+)\s*hamburger/i),mf=c.match(/(\d+)\s*nelle feste/i);
  const base=mb?+mb[1]:25,festaN=mf?+mf[1]:30;
  const f=festaHamburger(new Date()),n=f?festaN:base;
  const sub=done?'fatto ✓':(f?`🎄 ${f}: dose maggiorata`:'dose per tutta la settimana');
  const passi=[`Fai <b>${n} hamburger</b> da <b>120 g</b> l'uno`,'Pulisci la macchina schiaccia hamburger'];
  const html=passi.map((p,i)=>`<div class="st"><div class="num">${i+1}</div><div class="t">${p}</div></div>`).join('');
  return `<div class="row rowcol ${done?'ok':''}">
    <div class="head" onclick="spunta('${x.id}',${!done})">
      <div class="ic ${cat}">🍔</div>
      <div class="tx"><div class="c">Produzione hamburger</div><div class="s">${sub}</div></div>
      <div class="check"></div></div>
    <div class="steps">${html}</div></div>`;
}
function briocheRow(x,done,cat){
  const come=x.come||'';
  const m=come.match(/Teglia di oggi:\s*([\s\S]*?)\.\s*([\s\S]*)$/i);
  let lista=m?m[1].trim():come, nota=m?m[2].trim():'';
  let corpo;
  if(/da definire/i.test(lista)){
    corpo=`<div class="brionote">Teglia di oggi da definire.</div>`;
  }else{
    corpo='<div class="brio">'+lista.split(',').map(it=>{
      const mm=it.trim().match(/^(\d+)\s+(.*)$/);
      return mm?`<div class="b"><b>${mm[1]}</b><span>${mm[2]}</span></div>`:`<div class="b"><span>${it.trim()}</span></div>`;
    }).join('')+'</div>';
  }
  return `<div class="row rowcol ${done?'ok':''}">
    <div class="head" onclick="spunta('${x.id}',${!done})">
      <div class="ic ${cat}">🥐</div>
      <div class="tx"><div class="c">Cuocere le brioche</div><div class="s">${done?'fatto ✓':'tocca la spunta quando sono in forno'}</div></div>
      <div class="check"></div></div>
    ${corpo}${nota?`<div class="brionote">${nota}</div>`:''}</div>`;
}
// attività che aprono direttamente l'app Cassa (meno passaggi)
const APRE={'fondo cassa':'morning','conteggio contanti':'closure'};
function apreCassa(vista,cosa,el){
  salvaSessione();
  try{localStorage.setItem('negozio_ritorno',JSON.stringify({cosa,vista,ts:Date.now()}));}catch(e){}
  // risposta immediata al tocco, così si vede che sta aprendo la Cassa anche se la rete è lenta
  try{const s=el&&el.querySelector('.s');if(s)s.textContent='Apro la Cassa…';}catch(e){}
  setTimeout(()=>{location.assign('Cassa.html?v='+Date.now()+'#'+vista);},30);
}
function apreRow(x,done,cat,vista){
  return `<div class="row ${done?'ok':''}">
    <div class="head" style="display:flex;align-items:center;gap:16px;flex:1;cursor:pointer" onclick="apreCassa('${vista}','${x.cosa.replace(/'/g,"\\'")}',this)">
      <div class="ic ${cat}">💶</div>
      <div class="tx"><div class="c">${x.cosa}</div><div class="s">${done?'fatto ✓':'tocca: apre la Cassa →'}</div></div>
    </div>
    <div class="check" onclick="event.stopPropagation();spunta('${x.id}',${!done})"></div></div>`;
}
function stepsRow(x,done,cat){
  const passi=(x.come||'').split('||').map(s=>s.trim()).filter(Boolean);
  const html=passi.map((p,i)=>`<div class="st"><div class="num">${i+1}</div><div class="t">${p}</div></div>`).join('');
  return `<div class="row rowcol ${done?'ok':''}">
    <div class="head" onclick="spunta('${x.id}',${!done})">
      <div class="ic ${cat}">${emoji(cat,x.cosa)}</div>
      <div class="tx"><div class="c">${x.cosa}</div><div class="s">${done?'fatto ✓':(passi.length?'segui i passi, poi spunta':(x.come||'tocca quando è fatto'))}</div></div>
      <div class="check"></div></div>
    ${passi.length?`<div class="steps">${html}</div>`:''}
    ${x.foto_url?`<img src="${x.foto_url}" style="width:100%;border-radius:14px;margin-top:10px">`:''}
    ${ricettaHtml(x)}</div>`;
}
// Ricetta agganciata a una task: tasto "📖 Ricetta" che apre ingredienti e procedimento
function ricettaHtml(x){
  if(!x.ricetta)return '';
  const r=typeof x.ricetta==='string'?JSON.parse(x.ricetta):x.ricetta;
  const aperta=!!(S.ricette&&S.ricette.has(x.id));
  return `<button class="ricbtn" onclick="event.stopPropagation();toggleRicetta('${x.id}')">📖 ${aperta?'Chiudi la ricetta':'Ricetta: '+(r.titolo||'')}</button>`+
    (aperta?`<div class="ricetta"><div class="rt">${r.titolo||''}</div>
      ${(r.ingredienti||[]).length?`<div class="rh">Ingredienti</div><ul>${r.ingredienti.map(i=>`<li>${i}</li>`).join('')}</ul>`:''}
      ${(r.passi||[]).length?`<div class="rh">Procedimento</div><ol>${r.passi.map(p=>`<li>${p}</li>`).join('')}</ol>`:''}</div>`:'');
}
function toggleRicetta(id){S.ricette=S.ricette||new Set();if(S.ricette.has(id))S.ricette.delete(id);else S.ricette.add(id);render();}
function esciTurno(){try{localStorage.removeItem('miccone_sessione');}catch(e){}S={store:S.store,emp:null,pin:'',giornata:null,momento:null};schermataLogin();}
function vaiA(m){S.momento=m;salvaSessione();render();}
// La spunta si salva sul giorno che stai guardando (S.data) e si resta su quel giorno.
async function spunta(id,val){
  if(giornoFuturo()){alert('Questo giorno non è ancora arrivato: le spunte si fanno il giorno stesso.');return;}
  const x=S.giornata.attivita.find(a=>a.id===id);x.fatto=val;S._ultimaSpunta=Date.now();render();
  try{await rpc('cassa_task_spunta',{p_task:id,p_employee:S.emp.id,p_fatto:val,p_giorno:S.data||oggi()});}catch(e){}
}
const SOGLIA_ALLARME=8; // gradi: sopra questa temperatura parte la mail all'amministratore
const SOGLIA_AVVISO=6;  // gradi: sopra questa l'app avverte di controllare il frigo e riferire al responsabile
async function chiediTemp(id){
  if(giornoFuturo()){alert('Questo giorno non è ancora arrivato: le temperature si segnano il giorno stesso.');return;}
  const x=S.giornata.attivita.find(a=>a.id===id);
  const v=prompt(`${x.cosa} — che temperatura leggi? (gradi)`,x.valore!=null?x.valore:'');
  if(v===null||v==='')return;
  const n=parseFloat(String(v).replace(',','.'));if(isNaN(n))return;
  x.fatto=true;x.valore=n;S._ultimaSpunta=Date.now();render();
  try{await rpc('cassa_task_spunta',{p_task:id,p_employee:S.emp.id,p_fatto:true,p_valore:n,p_giorno:S.data||oggi()});}catch(e){}
  if(n>SOGLIA_ALLARME){allarmeFrigo(x,n);alert(`⚠️ ${x.cosa} a ${n}°: troppo caldo!\nControlla il frigo e riferisci al tuo responsabile.\nHo avvisato anche l'amministratore via mail.`);}
  else if(n>SOGLIA_AVVISO){alert(`⚠️ ${x.cosa} a ${n}°.\nControlla il frigo e riferisci al tuo responsabile.`);}
}
async function allarmeFrigo(x,n){
  try{await fetch(`${SB}/functions/v1/frigo-allarme`,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify({negozio:(S.store&&S.store.name||'').replace('🧪 ',''),frigo:x.cosa,valore:n,max_ok:x.max_ok,chi:S.emp&&S.emp.name,giorno:S.data||oggi()})});
  }catch(e){}
}
