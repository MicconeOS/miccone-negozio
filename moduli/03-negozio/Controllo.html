<style>
@font-face{font-family:'Miso';src:url('../../shared/fonts/Miso-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Miso';src:url('../../shared/fonts/Miso-Bold.woff2') format('woff2');font-weight:700;}
:root{--caffe:#3E2A1E;--crosta:#7B4D35;--crema:#F4EEDF;--panna:#FBF7F0;--sabbia:#E6DACA;--grigio:#8A8178;--oro:#F0C061;--rosso:#D63A2B;--verde:#5fa06a;--verdino:#e6f1e7;--rossino:#fbe7e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Miso','Trebuchet MS',sans-serif;background:var(--crema);color:var(--caffe);-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(160deg,#7B4D35,#5A3722);color:#FBF6EA;padding:16px 18px 14px}
.top .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:26px;line-height:1}
.top .sub{font-size:14px;color:#E8D5BD;margin-top:3px}
.top a{color:#F0C061;font-size:14px;text-decoration:none}
.giorni{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.giorni button{flex:none;min-width:72px;border:none;border-radius:12px;padding:8px 4px;font:700 14px 'Miso',sans-serif;background:rgba(251,246,234,.14);color:#F6E9D6;cursor:pointer}
.giorni button.on{background:#FBF6EA;color:#7B4D35}
.giorni button small{display:block;font-weight:400;font-size:11px;opacity:.8}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.allarme{background:var(--rossino);border:1px solid #e9b8ae;border-radius:14px;padding:10px 14px;margin:0 0 12px;color:#8a3226;font-size:15px}
.allarme b{display:block;font-size:16px;margin-bottom:3px}
.negozi{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.negozi{grid-template-columns:1fr}}
.negozio{background:var(--panna);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(62,42,30,.06)}
.testa{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{display:block}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .pct b{font-size:24px}
.ring .pct span{font-size:12px;color:var(--grigio);margin-top:2px}
.testa h2{margin:0;font-size:24px;line-height:1}
.testa .stato{font-size:15px;margin-top:4px;color:var(--grigio)}
.testa .stato.ok{color:var(--verde);font-weight:700}
.testa .stato.ko{color:var(--rosso);font-weight:700}
.momenti{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.momento{background:#fff;border-radius:12px;padding:8px 10px}
.momento .h{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--grigio)}
.momento b{display:block;font-size:18px;margin-top:2px}
.momento .bar{height:6px;background:var(--sabbia);border-radius:4px;overflow:hidden;margin-top:6px}
.momento .bar i{display:block;height:100%;background:var(--verde)}
.momento .bar i.ko{background:var(--rosso)}
.cassa{background:#fff;border-radius:14px;padding:4px 12px}
.cassa .cr{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.cassa .cr + .cr{border-top:1px dashed var(--sabbia)}
.cassa .ci{font-size:20px;line-height:1.2}
.cassa .cr b{font-size:16px}
.cassa .cr small{display:block;font-size:13px;color:var(--grigio);margin-top:2px;line-height:1.35}
.cassa .cr.ok b{color:#2f6b3a}
.cassa .cr.ko b{color:var(--rosso)}
.cassa .cr.tagli small{color:var(--caffe)}
.cassa .cr.tagli small b{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--grigio);margin-right:4px}
.cassa .cr.tagli small i{font-style:normal;color:var(--grigio)}
.sez{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--crosta);font-weight:700;margin:16px 0 6px}
.persona{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.persona .nome{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;list-style:none}
.persona .nome::-webkit-details-marker{display:none}
.persona .nome b{font-size:19px}
.persona .nome span{font-size:14px;color:var(--grigio)}
.persona .nome i{font-style:normal;display:inline-block;transition:transform .15s;color:var(--crosta)}
.persona[open] .nome i{transform:rotate(180deg)}
.persona ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:14px}
@media (max-width:1000px){.persona ul{grid-template-columns:1fr}}
.persona li{display:flex;gap:6px;align-items:baseline;padding:2px 0;border-top:1px dashed var(--sabbia)}
.persona li .ora{color:var(--grigio);font-size:12px;min-width:38px}
.persona li .t{color:var(--grigio);font-size:12px}
.persona li .v{margin-left:auto;font-weight:700;font-size:13px;color:var(--verde)}
.persona li .v.ko{color:var(--rosso)}
.persona details summary{cursor:pointer;font-size:14px;color:var(--crosta);margin-top:6px}
.dafare{background:#fff;border-radius:14px;padding:10px 12px}
.dafare .dh{display:flex;align-items:center;gap:10px}
.dafare .dh b{font-size:22px;color:var(--rosso)}
.dafare .dh span{flex:1;font-size:14px;color:var(--grigio)}
.dafare .dh button{border:none;background:var(--crema);color:var(--crosta);border-radius:10px;padding:6px 12px;font:700 14px 'Miso',sans-serif;cursor:pointer}
.dafare .elenco{display:none;margin-top:8px;font-size:14px;line-height:1.5;color:var(--caffe)}
.dafare.aperto .elenco{display:block}
.dafare .mom{padding:6px 0;border-top:1px dashed var(--sabbia)}
.dafare .mom b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--grigio);margin-bottom:2px}
.completa{background:var(--verdino);border-radius:14px;padding:12px;color:#2f6b3a;font-weight:700;font-size:16px;text-align:center}
.vuoto{color:var(--grigio);font-size:14px;padding:6px 2px}
.foot{margin:18px 0 30px;text-align:center;font-size:13px;color:var(--grigio)}
.foot a{color:var(--crosta)}
.gate{max-width:380px;margin:40px auto;background:var(--panna);border-radius:18px;padding:24px;text-align:center}
.gate h2{margin:0 0 6px}
.gate p{margin:0 0 14px;color:var(--grigio);font-size:14px}
.gate input{width:100%;font-size:30px;letter-spacing:10px;text-align:center;padding:10px;border:1px solid var(--sabbia);border-radius:12px;font-family:inherit}
.gate button{margin-top:12px;width:100%;background:var(--caffe);color:#FBF6EA;border:none;border-radius:12px;padding:13px;font:700 18px 'Miso',sans-serif;cursor:pointer}
.gate .err{color:var(--rosso);font-size:14px;min-height:20px;margin-top:8px}
.carico{text-align:center;color:var(--grigio);padding:40px}
</style>
</head>

const SB = "https://cdyfdwwfbfitfjazxses.supabase.co";

async function rpc(n, a) {
  const r = await fetch(`${SB}/rest/v1/rpc/${n}`, {method:'POST',
    headers:{'Content-Type':'application/json', apikey:KEY, Authorization:'Bearer '+KEY}, body:JSON.stringify(a||{})});
  const j = await r.json().catch(()=>null);
  if (!r.ok) throw new Error((j && (j.message || j.error)) || ('Errore '+r.status));
  return j;
}
const oraIT = ts => ts ? new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : '';
const sicuro = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (f,p) => p ? Math.round(f/p*100) : 0;
const MOM = ['mattina','pomeriggio','sera'];
const SESS = 'madia_controllo_admin';   // {id, nome, pin, ts} — vale 12 ore su questo dispositivo
const oggiISO = () => new Date().toLocaleDateString('en-CA');
let R = null, GIORNO = oggiISO();

function sessione(){ try{ const s=JSON.parse(localStorage.getItem(SESS)||'null'); if(s && s.pin && Date.now()-s.ts < 12*3600*1000) return s; }catch(e){} return null; }
function esci(){ try{ localStorage.removeItem(SESS); }catch(e){} mostraGate(); }

function mostraGate(msg){
  document.getElementById('pagina').innerHTML = `
    <div class="gate"><h2>🔒 Controllo negozi</h2><p>PIN dell'amministratore</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••">
      <button id="entra">Entra</button><div class="err" id="err">${msg||''}</div></div>`;
  const inp = document.getElementById('pin'); inp.focus();
  const vai = async () => {
    const pin = inp.value.trim(); if (!pin) return;
    document.getElementById('err').textContent = 'Controllo…';
    try {
      const stores = await rpc('cassa_stores', {});
      const emps = await rpc('cassa_employees', {p_store: stores[0].id});
      for (const a of emps.filter(e => e.role === 'admin')) {
        const r = await rpc('cassa_login', {p_employee: a.id, p_pin: pin});
        if (r && r.id && !r.errore) { localStorage.setItem(SESS, JSON.stringify({id:r.id, nome:r.name, pin, ts:Date.now()})); return carica(); }
      }
      document.getElementById('err').textContent = 'PIN sbagliato'; inp.value=''; inp.focus();
    } catch(e) { document.getElementById('err').textContent = 'Niente rete, riprova'; }
  };
  document.getElementById('entra').onclick = vai;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') vai(); });
}

async function carica(){
  const s = sessione(); if (!s) return mostraGate();
  const da = new Date(); da.setDate(da.getDate() - 13);   // 14 giorni: oggi e le due settimane precedenti
  try { R = await rpc('cassa_report_dipendenti', {p_employee: s.id, p_pin: s.pin, p_da: da.toLocaleDateString('en-CA'), p_a: oggiISO()}); }
  catch(e) { try{ localStorage.removeItem(SESS); }catch(_){} return mostraGate('Accesso scaduto o PIN cambiato: rientra'); }
  disegna();
}
function vaiGiorno(iso){ GIORNO = iso; disegna(); window.scrollTo(0,0); }

function etichettaGiorno(iso){
  const d = new Date(iso+'T00:00'), o = oggiISO();
  const ieri = new Date(); ieri.setDate(ieri.getDate()-1);
  if (iso === o) return ['Oggi', d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})];
  if (iso === ieri.toLocaleDateString('en-CA')) return ['Ieri', d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})];
  return [d.toLocaleDateString('it-IT',{weekday:'short'}), d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})];
}

function ring(p){
  const dash = 2*Math.PI*36, off = dash - dash*p/100, col = p>=100?'#5fa06a':(p>=50?'#F0C061':'#D63A2B');
  return `<div class="ring"><svg viewBox="0 0 86 86" width="86" height="86"><circle cx="43" cy="43" r="36" fill="none" stroke="#E6DACA" stroke-width="9"/>
    <circle cx="43" cy="43" r="36" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 43 43)"/></svg>
    <div class="pct"><b>${p}%</b><span>fatto</span></div></div>`;
}

const eur = n => (n==null||isNaN(+n)) ? '—' : (+n).toLocaleString('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:(Math.round(+n*100)%100)?2:0,maximumFractionDigits:2});
const segno = n => (+n>0?'+':'') + eur(n);
// la cassa del giorno per un negozio: fondo del mattino e chiusura della sera
function cassaCard(sede){
  const righe = (R.cassa || []).filter(x => x.sede === sede && x.giorno === GIORNO);
  const m = righe.find(x => x.tipo === 'mattina'), c = righe.find(x => x.tipo === 'chiusura');
  const eOggi = GIORNO === oggiISO(), ora = new Date().getHours();
  const okDiff = d => Math.abs(+d) <= 0.5;
  const rigaM = m
    ? `<div class="cr ${okDiff(m.differenza)?'ok':'ko'}"><span class="ci">🌅</span><div><b>Fondo del mattino ${okDiff(m.differenza)?'giusto':segno(m.differenza)}</b><small>contati ${eur(m.contati)} su ${eur(m.attesi)} attesi · ${sicuro(m.chi||'—')} ${oraIT(m.ora)}${m.note?' · '+sicuro(m.note):''}</small></div></div>`
    : `<div class="cr ${eOggi && ora < 10 ? '' : 'ko'}"><span class="ci">🌅</span><div><b>Fondo del mattino ${eOggi && ora < 10 ? 'non ancora controllato' : 'non controllato'}</b></div></div>`;
  const rigaC = c
    ? `<div class="cr ${okDiff(c.differenza)?'ok':'ko'}"><span class="ci">🌙</span><div><b>Chiusura ${okDiff(c.differenza)?'in pari':segno(c.differenza)}</b><small>contati ${eur(c.contati)} = partenza ${eur(c.partenza)} + incasso contanti ${eur(c.pos)}${okDiff(c.differenza)?'':' '+segno(c.differenza)} · busta ${c.busta_n?'n. '+sicuro(c.busta_n)+' ':''}${eur(c.busta)} · lasciati ${eur(c.attesi)} · ${sicuro(c.chi||'—')} ${oraIT(c.ora)}${c.note?' · '+sicuro(c.note):''}</small></div></div>`
    : `<div class="cr ${eOggi ? '' : 'ko'}"><span class="ci">🌙</span><div><b>Chiusura ${eOggi ? 'non ancora fatta' : 'non fatta'}</b></div></div>`;
  // i tagli contati alla chiusura: banconote e monete, solo quelli presenti
  let tagli = '';
  if (c && c.tagli) {
    const t = c.tagli, fmt = d => (+d >= 1 ? (+d) + ' €' : Math.round(+d*100) + ' c');
    const lista = Object.keys(t).map(d => [+d, +t[d]]).filter(([d,q]) => q > 0).sort((a,b) => b[0]-a[0]);
    const ban = lista.filter(([d]) => d >= 5), mon = lista.filter(([d]) => d < 5);
    const riga = (nome, arr) => arr.length ? `<div><b>${nome}</b> ${arr.map(([d,q]) => q + '×' + fmt(d)).join(' · ')} <i>= ${eur(arr.reduce((s,[d,q]) => s + d*q, 0))}</i></div>` : '';
    tagli = `<div class="cr tagli"><span class="ci">🪙</span><div><small>${riga('Banconote', ban)}${riga('Monete', mon)}</small></div></div>`;
  }
  return `<div class="cassa">${rigaM}${rigaC}${tagli}</div>`;
}
function disegna(){
  const s = sessione(); if (!s) return mostraGate();
  const giorni = R.giorni || [], det = (R.dettaglio || []).filter(x => x.giorno === GIORNO), allarmi = (R.allarmi || []).filter(a => a.giorno === GIORNO);
  const sedi = [...new Set(giorni.map(r => r.sede))].sort((a,b) => (/duomo/i.test(b)?1:0) - (/duomo/i.test(a)?1:0) || a.localeCompare(b)); // Duomo prima
  const listaGiorni = [...new Set(giorni.map(r => r.giorno))].sort().reverse().slice(0,14); // oggi a sinistra, poi indietro (la barra scorre)
  const eOggi = GIORNO === oggiISO();

  const negozio = sede => {
    const o = giorni.find(r => r.sede === sede && r.giorno === GIORNO) || {previste:0,fatte:0};
    const p = pct(o.fatte, o.previste);
    const righe = det.filter(x => x.sede === sede);
    const fatte = righe.filter(x => x.fatto), manca = righe.filter(x => !x.fatto);
    const persone = [...new Set(fatte.map(x => x.chi || '—'))].map(chi => ({chi, righe: fatte.filter(x => (x.chi||'—') === chi)})).sort((a,b) => b.righe.length - a.righe.length);
    const stato = !o.previste ? '' : p >= 100 ? '<div class="stato ok">✅ Giornata completa</div>' : (eOggi ? `<div class="stato">${o.previste - o.fatte} ancora da fare</div>` : `<div class="stato ko">${o.previste - o.fatte} non fatte</div>`);
    const riga = x => `<li><span class="ora">${oraIT(x.ora)}</span><span>${sicuro(x.cosa)}</span><span class="t">${x.momento}</span>${x.valore!=null?`<span class="v ${x.valore>8?'ko':''}">${x.valore}°</span>`:''}</li>`;
    return `<div class="negozio">
      <div class="testa">${ring(p)}<div><h2>${sicuro(sede)}</h2><div class="stato">${o.fatte} su ${o.previste} attività</div>${stato}</div></div>
      <div class="momenti">${MOM.map(m => { const r = righe.filter(x => x.momento === m), f = r.filter(x => x.fatto).length, q = pct(f, r.length);
        return `<div class="momento"><div class="h">${m}</div><b>${f}/${r.length}</b><div class="bar"><i class="${(!eOggi && q<100)?'ko':''}" style="width:${q}%"></i></div></div>`; }).join('')}</div>
      <div class="sez">Cassa</div>
      ${cassaCard(sede)}
      <div class="sez">Chi ha fatto cosa</div>
      ${persone.length ? persone.map(pz => `<details class="persona">
          <summary class="nome"><b>${sicuro(pz.chi)}</b><span>${pz.righe.length} attività · ultima ${oraIT(pz.righe[pz.righe.length-1].ora)} <i>▾</i></span></summary>
          <ul>${pz.righe.map(riga).join('')}</ul>
        </details>`).join('') : `<div class="vuoto">${eOggi ? 'Nessuna spunta ancora oggi.' : 'Nessuna spunta quel giorno.'}</div>`}
      ${o.previste ? (manca.length ? `<div class="sez">${eOggi ? 'Da fare' : 'Non fatto'}</div><div class="dafare">
          <div class="dh"><b>${manca.length}</b><span>${MOM.map(m => { const n = manca.filter(x => x.momento === m).length; return n ? `${m} ${n}` : ''; }).filter(Boolean).join(' · ')}</span><button onclick="this.closest('.dafare').classList.toggle('aperto');this.textContent=this.closest('.dafare').classList.contains('aperto')?'chiudi':'vedi'">vedi</button></div>
          <div class="elenco">${MOM.map(m => { const v = manca.filter(x => x.momento === m); return v.length ? `<div class="mom"><b>${m}</b>${v.map(x => sicuro(x.cosa)).join(' · ')}</div>` : ''; }).join('')}</div>
        </div>` : '<div class="completa">🏆 Tutto fatto</div>') : ''}
    </div>`;
  };

  document.getElementById('pagina').innerHTML = `
    <div class="top">
      <div class="r1"><div><h1>Controllo negozi</h1><div class="sub">Chi ha fatto cosa, Duomo e Borgo</div></div><a href="#" id="esci">${sicuro(s.nome)} · esci</a></div>
      <div class="giorni">${listaGiorni.map(g => { const [a,b] = etichettaGiorno(g); return `<button class="${g===GIORNO?'on':''}" onclick="vaiGiorno('${g}')">${a}<small>${b}</small></button>`; }).join('')}</div>
    </div>
    <div class="wrap">
      ${allarmi.length ? `<div class="allarme"><b>⚠️ Frigo sopra gli 8°</b>${allarmi.map(a => `${sicuro(a.sede)} · ${sicuro(a.cosa)} a ${a.valore}° (${sicuro(a.chi||'—')})`).join('<br>')}</div>` : ''}
      <div class="negozi">${sedi.map(negozio).join('') || '<div class="vuoto">Nessun dato.</div>'}</div>
      <div class="foot">Aggiornato ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})} · <a href="#" id="ricarica">ricarica</a> · <a href="Negozio-v2.html">app dipendenti</a> · <a href="Cassa.html">cassa</a></div>
    </div>`;
  document.getElementById('esci').onclick = e => { e.preventDefault(); esci(); };
  document.getElementById('ricarica').onclick = e => { e.preventDefault(); carica(); };
}
carica();
// si aggiorna da sola ogni 5 minuti quando è aperta
setInterval(() => { if (sessione() && R) carica(); }, 5*60*1000);
</script>
